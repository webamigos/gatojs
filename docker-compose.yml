services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_app
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
  mail:
    image: axllent/mailpit
    restart: always
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
  # wa:services:start
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: always
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio:/data
  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - >-
        for _ in $$(seq 1 30); do
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket wa-app-uploads 2>/dev/null
        || aws --endpoint-url http://minio:9000 s3 mb s3://wa-app-uploads 2>/dev/null
        && exit 0; sleep 2; done; echo "bucket creation failed" >&2; exit 1
  # wa:services:end
