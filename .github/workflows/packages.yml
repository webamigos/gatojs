name: GatoJS packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  create-gato-app:
    name: create-gato-app (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Verify create-gato-app
        run: npm run verify --prefix packages/create-gato-app

  smoke:
    name: Packed tarballs (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: core
            modules: ""
          - name: all
            modules: "audit-logs,api-keys,uploads"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Pack both packages, install the tarballs, create projects with the packed gato-cli
        env:
          SMOKE_INSTALL: "1"
          MODULES: ${{ matrix.combo.modules }}
        run: bash packages/create-gato-app/scripts/smoke-pack.sh "$GITHUB_WORKSPACE" --modules "$MODULES"

  node-range:
    name: create-gato-app refuses an unsupported Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Pack both packages and install the tarballs into an empty prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/prefix"
          (cd packages/gato-cli && npm pack --silent --pack-destination "$RUNNER_TEMP/pack")
          (cd packages/create-gato-app && npm pack --silent --pack-destination "$RUNNER_TEMP/pack")
          cd "$RUNNER_TEMP/prefix"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Node 20 is refused before anything is downloaded
        run: |
          set -uo pipefail
          output=$(node "$RUNNER_TEMP/prefix/node_modules/create-gato-app/dist/index.js" "$RUNNER_TEMP/old-node-app" --yes 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "create-gato-app ran under Node 20." >&2
            exit 1
          fi
          if ! grep -q "too old" <<<"$output"; then
            echo "The refusal does not say the Node version is too old." >&2
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/old-node-app" ]; then
            echo "The refused run created the project directory." >&2
            exit 1
          fi
