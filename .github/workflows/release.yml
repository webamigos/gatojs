name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.released.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kit/release/package-lock.json

      - name: Install pinned npm
        run: npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install release dependencies
        run: npm ci --prefix kit/release

      - name: Test release scripts
        run: npm test --prefix kit/release

      - name: Version before the release
        id: before
        run: echo "version=$(node -p "require('./kit/kit.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npm run release --prefix kit/release

      - name: Released version
        id: released
        env:
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          after=$(node -p "require('./kit/kit.json').version")
          if [ "$after" != "$BEFORE" ]; then
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Publish the release image
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}
