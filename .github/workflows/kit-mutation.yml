name: GatoJS mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker CLI (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation --prefix packages/gato-cli

      - name: Mutation gate for critical files
        run: npm run test:mutation:gate --prefix packages/gato-cli

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kit-mutation-report
          path: packages/gato-cli/reports/mutation/
          if-no-files-found: ignore
