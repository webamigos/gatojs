name: Mutation testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wa_app_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore incremental reports
        uses: actions/cache@v4
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-integration-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-

      - name: Run Stryker (unit)
        run: npm run test:mutation

      - name: Run Stryker (integration)
        run: npm run test:mutation:integration

      - name: Mutation gate for critical files
        run: npm run test:mutation:gate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/
            reports/mutation-integration/
          if-no-files-found: ignore
