name: GatoJS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    name: CLI (verify + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Verify CLI
        run: npm run verify --prefix packages/gato-cli

      - name: Kit state and generated files are up to date
        run: npm run wa -- kit sync && npm run wa -- generate && git diff --exit-code

      - name: Bundle is up to date
        run: git diff --exit-code -- .wa/bin/wa.mjs

  # Dependabot updates package.json only; the module manifests pin the same versions.
  # Read-only on purpose: no write-back, no secret, the job prints the command to run.
  dependabot-manifests:
    name: Dependabot manifests follow package.json
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Manifests follow package.json
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/kit/sync-manifest-deps.ts --check --base "origin/$BASE_REF"

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kit/release/package-lock.json

      - name: Install release dependencies
        run: npm ci --prefix kit/release

      - name: Test release scripts
        run: npm test --prefix kit/release

  cli-package:
    name: CLI package (pack + run gato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root and workspaces)
        run: npm ci

      - name: Pack the CLI as npm would publish it
        working-directory: packages/gato-cli
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Install the tarball into an empty prefix
        run: |
          mkdir -p "$RUNNER_TEMP/gato"
          cd "$RUNNER_TEMP/gato"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/gato-cli-*.tgz
          echo "GATO=$RUNNER_TEMP/gato/node_modules/.bin/gato" >> "$GITHUB_ENV"

      - name: Reports the version from package.json, prints help, rejects an unknown command
        run: |
          set -euo pipefail
          declared=$(node -p "require('./packages/gato-cli/package.json').version")
          reported=$("$GATO" --version)
          if [ "$declared" != "$reported" ]; then
            echo "Packed CLI reports $reported, package.json says $declared." >&2
            exit 1
          fi
          "$GATO" --help
          if "$GATO" nope >/dev/null 2>&1; then
            echo "gato nope exited 0; a script would read that as success." >&2
            exit 1
          fi

      - name: Creates a project from the checked-out kit
        run: |
          "$GATO" create "$RUNNER_TEMP/gato-app" --kit "$GITHUB_WORKSPACE" --yes --no-install --no-git
          test -f "$RUNNER_TEMP/gato-app/.wa/kit.json"

      - name: Lists modules and regenerates inside the project
        working-directory: ${{ runner.temp }}/gato-app
        run: |
          "$GATO" list --kit "$GITHUB_WORKSPACE"
          "$GATO" generate

  assemble:
    name: Assemble (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: core
            modules: ""
          - name: audit-logs
            modules: "audit-logs"
          - name: api-keys
            modules: "api-keys"
          - name: uploads
            modules: "uploads"
          - name: encryption
            modules: "encryption"
          - name: all
            modules: "audit-logs,api-keys,uploads,encryption"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matrix_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create project from the checked-out kit
        run: node .wa/bin/wa.mjs create "$RUNNER_TEMP/matrix-app" --yes --kit "$GITHUB_WORKSPACE" --modules "${{ matrix.combo.modules }}"

      - name: Test gates are in the project
        working-directory: ${{ runner.temp }}/matrix-app
        run: test -f stryker.config.json && test -f mutation-gate.json && test -f .claude/hooks/protect-tests.mjs && test -f .claude/hooks/protect-gato-files.mjs && test -f .claude/agents/test-writer.md && test -f .claude/agents/test-reviewer.md

      - name: No placeholders left in the project
        working-directory: ${{ runner.temp }}/matrix-app
        run: |
          set +e
          git grep -nE "WA App|wa-app|wa_app" -- . ':!**/__tests__/**' ':!**/*.test.*' ':!package-lock.json' ':!.wa/bin/**'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Placeholders left in the project"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git grep failed with status $status"
            exit "$status"
          fi

      - name: Self-hosted stack is in the project
        working-directory: ${{ runner.temp }}/matrix-app
        env:
          POSTGRES_PASSWORD: assemble
        run: |
          cp .env.selfhost.example .env.selfhost
          docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost --profile tools --profile s3 config --quiet
          rm .env.selfhost

      - name: Validate schema
        working-directory: ${{ runner.temp }}/matrix-app
        run: npx prisma validate

      - name: Migrate
        working-directory: ${{ runner.temp }}/matrix-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matrix_e2e
        run: npx prisma migrate dev --name init

      - name: Generated files are up to date
        working-directory: ${{ runner.temp }}/matrix-app
        run: npm run wa -- generate && git diff --exit-code

      - name: Verify project
        working-directory: ${{ runner.temp }}/matrix-app
        run: npm run verify

      - name: Start MinIO
        if: contains(matrix.combo.modules, 'uploads')
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82 server /data
          for _ in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Create MinIO bucket
        if: contains(matrix.combo.modules, 'uploads')
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.39.2 --endpoint-url http://localhost:9000 s3 mb s3://matrix-app-uploads

      - name: Integration tests
        working-directory: ${{ runner.temp }}/matrix-app
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matrix_app_test
          INTEGRATION_S3_ENDPOINT: http://localhost:9000
          INTEGRATION_S3_BUCKET: matrix-app-uploads
        run: npm run test:integration

      - name: Docker image builds
        if: matrix.combo.name == 'core' || matrix.combo.name == 'all'
        working-directory: ${{ runner.temp }}/matrix-app
        run: docker build .

      - name: Project module is registered without editing core tests
        working-directory: ${{ runner.temp }}/matrix-app
        run: |
          cp -R "$GITHUB_WORKSPACE/packages/gato-cli/src/__tests__/fixtures/project-module/." .
          node -e '
            const fs = require("node:fs");
            const state = JSON.parse(fs.readFileSync(".wa/kit.json", "utf8"));
            state.projectModules = {
              ...state.projectModules,
              notes: {
                manifest: {
                  name: "notes",
                  version: "0.1.0",
                  description: "Notatki",
                  requires: [],
                  files: ["src/features/notes/**", "prisma/schema/notes.prisma"],
                  dependencies: {},
                  devDependencies: {},
                  env: [{ name: "NOTES_LIMIT", example: "10" }],
                  schemaRelations: [{ model: "Organization", field: "notes Note[]" }],
                  compose: null,
                  ciSteps: null,
                  workspaces: [],
                },
              },
            };
            fs.writeFileSync(".wa/kit.json", JSON.stringify(state, null, 2) + "\n");
          '
          npm run wa -- generate
          npm run typecheck
          npm test
          npm run build

      - name: Invoices project module uses the extension points without editing Gato files
        if: matrix.combo.name == 'uploads' || matrix.combo.name == 'all'
        working-directory: ${{ runner.temp }}/matrix-app
        env:
          FIXTURE: ${{ github.workspace }}/packages/gato-cli/src/__tests__/fixtures/invoices-module
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matrix_e2e
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matrix_app_test
          INTEGRATION_S3_ENDPOINT: http://localhost:9000
          INTEGRATION_S3_BUCKET: matrix-app-uploads
        run: |
          cp -R "$FIXTURE/prisma" "$FIXTURE/src" .
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.env.FIXTURE + "/manifest.json", "utf8"));
            const state = JSON.parse(fs.readFileSync(".wa/kit.json", "utf8"));
            state.projectModules = { ...state.projectModules, invoices: { manifest } };
            fs.writeFileSync(".wa/kit.json", JSON.stringify(state, null, 2) + "\n");
          '
          npm run wa -- generate
          npx prisma migrate dev --name add-invoices
          npx prisma generate
          git add -A
          doctor=$(npm run --silent wa -- doctor --files)
          echo "$doctor"
          if [ "$doctor" != "GatoJS files: no changes" ]; then
            echo "The invoices fixture changed a Gato file; use an extension point instead." >&2
            exit 1
          fi
          npm run typecheck
          npm test
          npm run test:integration
          npm run build
          npm run wa -- generate
          git diff --exit-code

  # The S3 presets in docs/15-modul-uploads.md marked "verified in CI" run here.
  storage-presets:
    name: Storage preset (${{ matrix.store.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store:
          - name: minio
            image: cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
            args: server /data
            access-key: minioadmin
            secret-key: minioadmin
            env: -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
            health: /minio/health/live
          - name: rustfs
            image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
            args: ""
            access-key: gato-rustfs
            secret-key: gato-rustfs-secret
            env: -e RUSTFS_ACCESS_KEY=gato-rustfs -e RUSTFS_SECRET_KEY=gato-rustfs-secret
            health: /health/ready
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wa_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STORE_IMAGE: ${{ matrix.store.image }}
      STORE_ARGS: ${{ matrix.store.args }}
      STORE_ENV: ${{ matrix.store.env }}
      STORE_HEALTH: ${{ matrix.store.health }}
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wa_app_test
      INTEGRATION_S3_ENDPOINT: http://localhost:9000
      INTEGRATION_S3_BUCKET: preset-uploads
      INTEGRATION_S3_ACCESS_KEY_ID: ${{ matrix.store.access-key }}
      INTEGRATION_S3_SECRET_ACCESS_KEY: ${{ matrix.store.secret-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start the store
        run: |
          # shellcheck disable=SC2086
          docker run -d --name store -p 9000:9000 $STORE_ENV "$STORE_IMAGE" $STORE_ARGS
          for _ in $(seq 1 30); do
            curl -fs "http://localhost:9000$STORE_HEALTH" && exit 0
            sleep 2
          done
          docker logs store
          echo "The store did not become healthy" >&2
          exit 1

      - name: Create the bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID="$INTEGRATION_S3_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$INTEGRATION_S3_SECRET_ACCESS_KEY" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.39.2 --endpoint-url http://localhost:9000 s3 mb "s3://$INTEGRATION_S3_BUCKET"

      - name: Storage integration test
        run: npx vitest run --config vitest.integration.config.ts src/features/uploads/services/__tests__/storage.integration.test.ts
