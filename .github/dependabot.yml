version: 2

updates:
  # The root entry also updates the workspaces (packages/gato-cli): they share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors are upgraded deliberately with the wa-upgrade-dependency skill:
      # the kit manifests and every assembled project move with them.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # OpenTelemetry's 0.x packages break on minor versions and must move
      # together with @opentelemetry/api, which better-auth also pins.
      - dependency-name: "@opentelemetry/*"
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci
