x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}@db:5432/wa_app

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: wa_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wa_app"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    image: ${APP_IMAGE:-wa-app:local}
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    env_file: .env.selfhost
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    image: ${APP_IMAGE:-wa-app:local}
    env_file: .env.selfhost
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/volumes/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/healthcheck",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
  tools:
    build:
      context: .
      target: builder
    image: wa-app-tools:local
    profiles: ["tools"]
    env_file: .env.selfhost
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  # wa:services:start
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    profiles: ["s3"]
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./volumes/minio:/data
  minio-init:
    image: amazon/aws-cli:2.39.2
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_started
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - >-
        rm -f /tmp/bucket-ready;
        for _ in $$(seq 1 30); do
        if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket ${S3_BUCKET:-wa-app-uploads} 2>/dev/null
        || aws --endpoint-url http://minio:9000 s3 mb s3://${S3_BUCKET:-wa-app-uploads} 2>/dev/null; then
        touch /tmp/bucket-ready; trap 'exit 0' TERM; while :; do sleep 3600 & wait $$!; done;
        fi; sleep 2; done; echo "bucket creation failed" >&2; exit 1
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bucket-ready"]
      interval: 2s
      timeout: 2s
      retries: 45
  # wa:services:end

volumes:
  postgres-data: {}
  uploads: {}
