suite: migrate job
templates:
  - migrate-job.yaml
tests:
  - it: renders one Job run before install and upgrade
    set:
      existingSecret: app-env
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade

  - it: runs prisma migrate deploy
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - node_modules/.bin/prisma
            - migrate
            - deploy

  - it: reads secrets from the Secret named by existingSecret
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: app-env

  - it: takes the envFrom secret name from existingSecret, not a fixed name
    set:
      existingSecret: crm-secrets
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: crm-secrets

  - it: never restarts a failed migration pod
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: retries as many times as migrations.backoffLimit
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 1

  - it: runs the app image
    set:
      existingSecret: app-env
      image.repository: registry.example.com/crm
      image.tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/crm:1.2.3

  - it: renders no Job when migrations are disabled
    set:
      existingSecret: app-env
      migrations.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: retries as many times as an overridden migrations.backoffLimit
    set:
      existingSecret: app-env
      migrations.backoffLimit: 3
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 3

  - it: deletes the previous Job before creating the hook again
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: names the Job after fullnameOverride with a migrate suffix
    set:
      existingSecret: app-env
      fullnameOverride: demo
    asserts:
      - equal:
          path: metadata.name
          value: demo-migrate

  - it: does not mount the service account token into the pod
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: runs the pod as non-root user 1001 with fsGroup 1001
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001

  - it: forbids privilege escalation and drops all capabilities in the container
    set:
      existingSecret: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: pulls the image with the secrets from image.pullSecrets
    set:
      existingSecret: app-env
      image.pullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred

  - it: sets no image pull secrets by default
    set:
      existingSecret: app-env
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
