suite: persistent volume claim
templates:
  - pvc.yaml
  - deployment.yaml
tests:
  - it: renders one PersistentVolumeClaim of 5Gi ReadWriteOnce for local storage
    set:
      existingSecret: app-env
    asserts:
      - hasDocuments:
          count: 1
        template: pvc.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: pvc.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        template: pvc.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        template: pvc.yaml

  - it: sizes the claim from persistence.size
    set:
      existingSecret: app-env
      persistence.size: 20Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
        template: pvc.yaml

  - it: renders no PersistentVolumeClaim for s3 storage
    set:
      existingSecret: app-env
      storage.provider: s3
      replicaCount: 3
    asserts:
      - hasDocuments:
          count: 0
        template: pvc.yaml

  - it: names the claim after the release and mounts that claim in the Deployment
    set:
      existingSecret: app-env
      fullnameOverride: demo
    asserts:
      - equal:
          path: metadata.name
          value: demo-uploads
        template: pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            persistentVolumeClaim:
              claimName: demo-uploads
          any: true
        template: deployment.yaml

  - it: mounts no claim in the Deployment for s3 storage
    set:
      existingSecret: app-env
      fullnameOverride: demo
      storage.provider: s3
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            persistentVolumeClaim:
              claimName: demo-uploads
          any: true
        template: deployment.yaml
