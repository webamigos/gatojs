suite: ingress
templates:
  - ingress.yaml
  - service.yaml
tests:
  - it: renders no Ingress by default
    set:
      existingSecret: app-env
    asserts:
      - hasDocuments:
          count: 0
        template: ingress.yaml

  - it: renders no Ingress when disabled even with a host
    set:
      existingSecret: app-env
      ingress.enabled: false
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 0
        template: ingress.yaml

  - it: routes the host to the Service on port 3000 when enabled
    set:
      existingSecret: app-env
      fullnameOverride: demo
      ingress.enabled: true
      ingress.host: app.example.com
    asserts:
      - hasDocuments:
          count: 1
        template: ingress.yaml
      - isKind:
          of: Ingress
        template: ingress.yaml
      - equal:
          path: spec.rules[0].host
          value: app.example.com
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 3000
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: demo
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: demo
        template: service.yaml

  - it: sets the ingress class and TLS secret
    set:
      existingSecret: app-env
      ingress.enabled: true
      ingress.host: app.example.com
      ingress.className: nginx
      ingress.tls:
        - secretName: app-tls
          hosts:
            - app.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
        template: ingress.yaml
      - equal:
          path: spec.tls[0].secretName
          value: app-tls
        template: ingress.yaml

  - it: fails when enabled without a host
    set:
      existingSecret: app-env
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: set ingress.host when ingress.enabled is true
        template: ingress.yaml
