nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: wa-app
  # Empty: the appVersion from Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Required. A Secret you create before installing, read with envFrom by the app and the migrate Job:
# DATABASE_URL, BETTER_AUTH_SECRET, the mail secrets (SMTP_USER, SMTP_PASS or RESEND_API_KEY)
# and the module secrets (S3 keys, API_KEY_PEPPER, ENCRYPTION_MASTER_KEY).
existingSecret: ""

# Non-secret variables, the same names as in .env.selfhost.example.
env:
  APP_URL: https://app.example.com
  EMAIL_FROM: "WA App <noreply@example.com>"
  MAIL_PROVIDER: smtp
  AUTH_PUBLIC_SIGNUP: "false"
  MULTI_ORG: "false"
  LOG_LEVEL: info

storage:
  # local: files on a PersistentVolumeClaim at /app/volumes/uploads, one replica.
  # s3: files in an S3-compatible store (S3_* in env and the Secret), any number of replicas.
  provider: local

persistence:
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  port: 3000

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

migrations:
  enabled: true
  backoffLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
